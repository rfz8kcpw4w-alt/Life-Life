<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life-Life — Tam Sürüm</title>
    <style>
      :root { --bg:#07141d; --panel:#0f1c2a; --text:#ebf3ff; --muted:#b7c5d8; --accent:#7af0a9; }
      * { box-sizing: border-box; }
      html,body { margin:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; background:linear-gradient(180deg,#07141d 0%,#0d1a27 100%); color:var(--text); }
      .app { max-width:1300px; margin:0 auto; display:flex; flex-direction:column; gap:16px; padding:16px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.02); padding:12px 14px; border-radius:10px; }
      h1 { margin:0; }
      .layout { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
      .panel { background:rgba(10,18,26,0.95); border-radius:12px; padding:12px; }
      canvas { display:block; width:100%; height:360px; border-radius:8px; background:linear-gradient(180deg,#0a1824,#0f1f2d); }
      .side { display:flex; flex-direction:column; gap:12px; }
      .controls { display:flex; gap:8px; flex-wrap:wrap; }
      .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
      .stat { background:rgba(255,255,255,0.02); border-radius:8px; padding:10px; }
      button, select, input { font:inherit; color:var(--text); }
      button { background:#12334a; padding:8px 10px; border:1px solid rgba(255,255,255,0.04); border-radius:8px; cursor:pointer; }
      select, input[type="range"] { background:#0c1a26; padding:8px; border:1px solid rgba(255,255,255,0.06); border-radius:8px; }
      .announce { min-height:48px; padding:8px; background:rgba(122,240,169,0.06); border-radius:8px; }
      .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      @media (max-width:900px){ .layout { grid-template-columns:1fr; } .topbar { flex-direction:column; align-items:flex-start; } }
      .chart-wrap { height:180px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar" aria-label="Başlık ve kontrol çubuğu">
        <h1>Life-Life — Tam Sürüm</h1>
        <div class="controls" role="toolbar" aria-label="Genel kontroller">
          <button id="pauseBtn" aria-pressed="false">Duraklat</button>
          <button id="resetBtn">Sıfırla</button>
          <button id="saveBtn">Kaydet</button>
          <button id="loadBtn">Yükle</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel" aria-label="Oyun alanı">
          <canvas id="gameCanvas" width="900" height="560" tabindex="0" aria-describedby="gameHint"></canvas>
          <div id="gameHint" class="sr-only">Oyun alanı. Boşluk: duraklat, artı ve eksi: hız değiştir.</div>
          <div style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
            <label for="speedRange">Hız:</label>
            <input id="speedRange" type="range" min="0.25" max="3" step="0.25" value="1" aria-label="Simülasyon hızı">
            <label for="populationSelect">Nüfus:</label>
            <select id="populationSelect" aria-label="Başlangıç nüfusu seçimi">
              <option>12</option>
              <option selected>20</option>
              <option>35</option>
              <option>50</option>
            </select>
          </div>
        </section>

        <aside class="panel side" aria-label="İstatistikler ve kontrol panosu">
          <div class="stat-grid" aria-live="polite">
            <div class="stat"><strong>Gün</strong><div id="dayValue">0</div></div>
            <div class="stat"><strong>Nüfus</strong><div id="populationValue">0</div></div>
            <div class="stat"><strong>Yiyecek</strong><div id="foodValue">0</div></div>
            <div class="stat"><strong>Mutluluk</strong><div id="happinessValue">0</div></div>
          </div>

          <div class="controls">
            <label for="agentJobSelect">Birey işi:</label>
            <select id="agentJobSelect" aria-label="İş seçimi">
              <option value="auto">Otomatik</option>
              <option value="worker">Worker</option>
              <option value="farmer">Farmer</option>
              <option value="none">None</option>
            </select>
            <button id="assignJobBtn">Ata</button>
          </div>

          <div class="chart-wrap panel" style="padding:8px;">
            <canvas id="popChart" aria-label="Nüfus grafiği"></canvas>
          </div>

          <div id="announcer" class="announce" role="status" aria-live="polite" aria-atomic="true">Simülasyon hazır.</div>

          <details>
            <summary>Kısa talimat</summary>
            <ul>
              <li>Boşluk: duraklat / devam</li>
              <li>+: hız arttır</li>
              <li>-: hız azalt</li>
              <li>R: sıfırla</li>
              <li>Haritaya tıklayıp birey seçin, ardından iş atayın.</li>
            </ul>
          </details>
        </aside>
      </main>
    </div>

    <script>
      (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dayValue = document.getElementById('dayValue');
        const populationValue = document.getElementById('populationValue');
        const foodValue = document.getElementById('foodValue');
        const happinessValue = document.getElementById('happinessValue');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const loadBtn = document.getElementById('loadBtn');
        const popSelect = document.getElementById('populationSelect');
        const speedRange = document.getElementById('speedRange');
        const announcer = document.getElementById('announcer');
        const agentJobSelect = document.getElementById('agentJobSelect');
        const assignJobBtn = document.getElementById('assignJobBtn');

        const popCtx = document.getElementById('popChart').getContext('2d');
        const popChart = new Chart(popCtx, {
          type: 'line',
          data: {
            labels: [],
            datasets: [{
              label: 'Nüfus',
              data: [],
              borderColor: '#7af0a9',
              backgroundColor: 'rgba(122,240,169,0.12)',
              tension: 0.3
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false } } }
        });

        let audioCtx = null;
        function beep(freq=440,dur=0.06,vol=0.04){
          try {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = freq; gain.gain.value = vol;
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur);
          } catch (e) {}
        }

        const world = { width:90, height:56, cell:10, agents:[], buildings:[], day:0, running:true, tickMs:60, timeAcc:0, saveKey:'life-life-save', selected:null, history:[] };

        function announce(msg){ announcer.textContent = msg; console.log(msg); }
        function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

        function seedBuildings(){
          world.buildings = [
            {x:15,y:12,type:'home'},{x:36,y:18,type:'home'},{x:64,y:14,type:'home'},{x:72,y:34,type:'home'},
            {x:12,y:34,type:'food'},{x:27,y:44,type:'food'},{x:44,y:32,type:'food'},{x:68,y:42,type:'food'},{x:81,y:18,type:'food'},
            {x:50,y:15,type:'work'},{x:58,y:42,type:'work'},{x:24,y:24,type:'work'}
          ];
        }

        function createAgent(id){
          return {
            id,
            x:45 + Math.cos(Math.random()*Math.PI*2) * (5 + Math.random()*20),
            y:28 + Math.sin(Math.random()*Math.PI*2) * (5 + Math.random()*20),
            hunger:25 + Math.random()*40,
            energy:60 + Math.random()*35,
            happiness:55 + Math.random()*35,
            age:0,
            speed:0.45 + Math.random()*0.7,
            state:'idle',
            job:Math.random() < 0.6 ? 'worker' : 'free',
            target:null
          };
        }

        function resetWorld(count = Number(popSelect.value)){
          world.day = 0;
          world.agents = Array.from({ length: count }, (_, i) => createAgent(i + 1));
          world.history = [world.agents.length];
          seedBuildings();
          world.selected = null;
          announce(`${count} birey oluşturuldu.`);
          updateChart();
          renderUI();
          draw();
        }

        function findNearestBuilding(agent, type){
          let best = null; let min = Infinity;
          for (const b of world.buildings){ if(b.type !== type) continue; const d = Math.hypot(b.x - agent.x, b.y - agent.y); if(d < min){ min = d; best = b; } }
          return best;
        }

        function chooseTarget(agent){
          if(agent.hunger > 70){ const f = findNearestBuilding(agent,'food'); if(f){ agent.state='food'; agent.target=f; return; } }
          if(agent.energy < 35){ const h = findNearestBuilding(agent,'home'); if(h){ agent.state='rest'; agent.target=h; return; } }
          if(agent.job === 'worker' && agent.happiness > 40 && Math.random() < 0.02){ const w = findNearestBuilding(agent,'work'); if(w){ agent.state='work'; agent.target=w; return; } }
          agent.state = 'idle';
          agent.target = { x:15 + Math.random() * (world.width - 30), y:15 + Math.random() * (world.height - 30) };
        }

        function updateAgent(agent){
          agent.age += 1;
          agent.hunger += 0.22;
          agent.energy -= 0.16;
          agent.happiness -= 0.04;
          if(agent.hunger > 99 || agent.energy < 0){ return false; }
          if(agent.state === 'idle' || !agent.target){ chooseTarget(agent); }
          if(agent.target){
            const dx = agent.target.x - agent.x; const dy = agent.target.y - agent.y; const d = Math.hypot(dx,dy); const step = agent.speed * (world.tickMs/1000) * 45;
            if(d > 0.5){ agent.x += (dx / d) * step; agent.y += (dy / d) * step; }
            else {
              if(agent.state === 'food'){ agent.hunger = Math.max(0, agent.hunger - 55); agent.happiness = Math.min(100, agent.happiness + 12); beep(880,0.06,0.02); }
              else if(agent.state === 'rest'){ agent.energy = Math.min(100, agent.energy + 46); agent.happiness = Math.min(100, agent.happiness + 8); beep(660,0.06,0.02); }
              else if(agent.state === 'work'){ agent.energy = Math.max(0, agent.energy - 20); agent.happiness = Math.min(100, agent.happiness + 6); }
              agent.state = 'idle'; agent.target = null;
            }
          }
          if(agent.hunger < 50 && agent.energy > 40 && Math.random() < 0.008 && agent.age > 40){
            const child = createAgent(Math.floor(agent.id * 1000 + Math.random() * 1000));
            child.x = agent.x + 1; child.y = agent.y + 1;
            world.agents.push(child); announce(`Yeni birey: ${child.id}`); beep(1200,0.08,0.03);
          }
          agent.happiness = clamp(agent.happiness + (agent.hunger < 55 ? -0.6 : 0.6), 0, 100);
          return true;
        }

        function updateSimulation(){
          if(!world.running) return;
          world.timeAcc += world.tickMs * Number(speedRange.value || 1);
          while(world.timeAcc >= world.tickMs){
            world.day += 1;
            world.timeAcc -= world.tickMs;
            for(let i = world.agents.length - 1; i >= 0; i--){
              const ok = updateAgent(world.agents[i]);
              if(!ok){
                world.agents.splice(i,1);
                announce(`Birey öldü. Kalan nüfus: ${world.agents.length}`);
                beep(220,0.12,0.04);
              }
            }
            if(world.agents.length === 0){
              announce('Tüm bireyler öldü. Sıfırlamak için butona basın.');
              world.running = false; pauseBtn.textContent = 'Devam Et'; pauseBtn.setAttribute('aria-pressed','true');
              break;
            }
            world.history.push(world.agents.length);
            if(world.history.length > 120){ world.history.shift(); }
            updateChart();
          }
          renderUI(); draw();
        }

        function draw(){
          ctx.clearRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle='#0b1925'; ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle='rgba(255,255,255,0.03)';
          for(let x=0; x<=world.width; x++){ ctx.fillRect(x * world.cell, 0, 1, canvas.height); }
          for(let y=0; y<=world.height; y++){ ctx.fillRect(0, y * world.cell, canvas.width, 1); }
          for(const b of world.buildings){
            const dx=b.x*world.cell, dy=b.y*world.cell;
            if(b.type === 'food'){ ctx.fillStyle='#f7d77a'; ctx.fillRect(dx-8,dy-8,16,16); }
            else if(b.type === 'home'){ ctx.fillStyle='#7cc7ff'; ctx.beginPath(); ctx.arc(dx,dy,8,0,Math.PI*2); ctx.fill(); }
            else if(b.type === 'work'){ ctx.fillStyle='#b48cff'; ctx.fillRect(dx-9,dy-7,18,14); }
          }
          for(const a of world.agents){
            const x=a.x * world.cell; const y=a.y * world.cell; const hue = 120 - (a.happiness/100) * 70;
            ctx.fillStyle = `hsl(${hue}, 80%, 62%)`;
            ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
            if(world.selected && world.selected.id === a.id){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.stroke(); }
          }
        }

        function renderUI(){
          const total = world.agents.reduce((s,a) => s + a.happiness, 0);
          const avg = world.agents.length ? Math.round(total / world.agents.length) : 0;
          dayValue.textContent = String(world.day);
          populationValue.textContent = String(world.agents.length);
          foodValue.textContent = String(world.buildings.filter(b => b.type === 'food').length);
          happinessValue.textContent = `${avg}%`;
        }

        function updateChart(){
          popChart.data.labels = world.history.map((_, idx) => idx);
          popChart.data.datasets[0].data = world.history.slice();
          popChart.update();
        }

        function saveState(){
          localStorage.setItem(world.saveKey, JSON.stringify({ day: world.day, agents: world.agents, buildings: world.buildings, history: world.history }));
          announce('Kaydedildi.');
        }

        function loadState(){
          const raw = localStorage.getItem(world.saveKey); if(!raw){ announce('Kayıt yok.'); return; }
          try{
            const s = JSON.parse(raw);
            world.day = s.day || 0;
            world.agents = Array.isArray(s.agents) ? s.agents : [];
            world.buildings = Array.isArray(s.buildings) && s.buildings.length ? s.buildings : [];
            world.history = Array.isArray(s.history) && s.history.length ? s.history : [world.agents.length];
            world.running = true; pauseBtn.textContent = 'Duraklat'; pauseBtn.setAttribute('aria-pressed','false');
            announce('Kayıt yüklendi.');
            renderUI(); updateChart(); draw();
          } catch(e){ announce('Yükleme hatası.'); }
        }

        function togglePause(){
          world.running = !world.running;
          pauseBtn.textContent = world.running ? 'Duraklat' : 'Devam Et';
          pauseBtn.setAttribute('aria-pressed', String(!world.running));
          announce(world.running ? 'Simülasyon devam ediyor.' : 'Simülasyon duraklatıldı.');
        }

        function assignSelectedJob(){
          if(!world.selected){ announce('Önce bir birey seçin.'); return; }
          const job = agentJobSelect.value;
          if(job === 'auto'){ world.selected.job = Math.random() < 0.6 ? 'worker' : 'farmer'; }
          else { world.selected.job = job; }
          announce(`Birey ${world.selected.id} iş atandı: ${world.selected.job}`);
        }

        canvas.addEventListener('click', (ev) => {
          const rect = canvas.getBoundingClientRect();
          const x = ((ev.clientX - rect.left) / rect.width) * world.width;
          const y = ((ev.clientY - rect.top) / rect.height) * world.height;
          let nearest = null; let nd = Infinity;
          for(const a of world.agents){ const d = Math.hypot(a.x - x, a.y - y); if(d < nd){ nd = d; nearest = a; } }
          if(nearest && nd < 5){
            world.selected = nearest;
            announce(`Seçildi: birey ${nearest.id} | açlık ${Math.round(nearest.hunger)} | enerji ${Math.round(nearest.energy)} | mutluluk ${Math.round(nearest.happiness)}`);
          } else {
            world.selected = null; announce('Yakınında birey yok.');
          }
          draw();
        });

        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', () => resetWorld(Number(popSelect.value)));
        saveBtn.addEventListener('click', saveState);
        loadBtn.addEventListener('click', loadState);
        assignJobBtn.addEventListener('click', assignSelectedJob);

        document.addEventListener('keydown', (e)=>{
          if(e.code === 'Space'){ e.preventDefault(); togglePause(); }
          if(e.key === '+'){ speedRange.value = String(Math.min(3, Number(speedRange.value) + 0.25)); announce(`Hız: ${speedRange.value}`); }
          if(e.key === '-'){ speedRange.value = String(Math.max(0.25, Number(speedRange.value) - 0.25)); announce(`Hız: ${speedRange.value}`); }
          if(e.key.toLowerCase() === 'r'){ resetWorld(Number(popSelect.value)); }
        });

        speedRange.addEventListener('input', () => announce(`Hız: ${speedRange.value}`));
        popSelect.addEventListener('change', () => resetWorld(Number(popSelect.value)));

        function resize(){
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width; canvas.height = Math.max(240, rect.height);
          draw();
        }
        window.addEventListener('resize', resize);

        seedBuildings();
        resetWorld(Number(popSelect.value));
        resize();
        setInterval(updateSimulation, world.tickMs);
      })();
    </script>
  </body>
</html>
